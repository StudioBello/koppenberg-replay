<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koppenberg Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="description" content="Volg elke renner van de Koppenbergcross, niet alleen de leider. Een gratis replay op het echte parcours, voor de fans van élke crosser. Een project van Studio Bello.">
<meta property="og:title" content="Koppenberg Replay">
<meta property="og:description" content="Ook nummer 14 heeft supporters. Volg élke renner van de Koppenbergcross, renner per renner, op het echte parcours.">
<meta property="og:type" content="website">
<meta property="og:image" content="social.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#18201B">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: broadcast-style replay desk. Stage left, gap board right, chapters + elevation + transport below.
   Clip mode turns the stage into a 9:16 frame for screen recording. Tabs: Replay / Jij vs de pro / Rondelogger / Data. */
:root{
  --bg:#EEF1EC; --panel:#F8FAF6; --ink:#18201B; --muted:#5B675F; --line:#CDD5CD;
  --course:#6B7F5E; --climb:#3A3632; --tape:#D2352B; --tape-soft:#F6D9D5; --shadow:rgba(24,32,27,.10);
  --ok:#2E7D4F; --warn:#A86A12; --scrim:rgba(248,250,246,.88);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131915; --panel:#1B231E; --ink:#E3E9E2; --muted:#93A197; --line:#2E3A32;
  --course:#8FA67F; --climb:#D9CFC2; --tape:#F0584C; --tape-soft:#3A1F1C; --shadow:rgba(0,0,0,.35); --ok:#6CC08F; --warn:#E0A54A; --scrim:rgba(27,35,30,.88); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131915; --panel:#1B231E; --ink:#E3E9E2; --muted:#93A197; --line:#2E3A32;
  --course:#8FA67F; --climb:#D9CFC2; --tape:#F0584C; --tape-soft:#3A1F1C; --shadow:rgba(0,0,0,.35); --ok:#6CC08F; --warn:#E0A54A; --scrim:rgba(27,35,30,.88); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--tape)}
.presented{display:flex;align-items:baseline;gap:8px;margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bello{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.32em;color:var(--ink)}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
nav a{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--muted);border:0;padding:8px 10px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

.races{display:flex;flex-wrap:wrap;gap:6px}
.races button{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 14px}
.races button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.notice{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);padding:9px 12px;border-radius:6px;font-size:13px}
.notice[data-status="official"]{border-left-color:var(--ok)}
.notice[data-status="estimated"]{border-left-color:var(--tape)}
.notice .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.notice[data-status="official"] .tag{color:var(--ok)}
.notice[data-status="reconstructed"] .tag{color:var(--warn)}
.notice[data-status="estimated"] .tag{color:var(--tape)}
.notice .src{color:var(--muted);font-size:12px}
.notice .src a{color:inherit}

.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:860px){.desk{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:340px;aspect-ratio:16/10;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.clock{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.lap{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hud-r{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--tape);background:var(--bg);color:var(--tape);border-radius:99px;padding:3px 9px;cursor:pointer}
.caption{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;padding:6px 12px;border-radius:6px;pointer-events:none;transition:opacity .3s}
.caption small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:400}
.hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--muted);pointer-events:none;text-align:right}

.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.board h2,.card h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;margin:0;padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2{padding:10px 0 4px}
.board h2 small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:none;font-weight:400}
.rows{display:flex;flex-direction:column;padding:0 6px 8px}
.row{display:grid;grid-template-columns:22px 10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover{background:var(--bg)}
.row[aria-pressed="true"],.row.battle{background:var(--tape-soft)}
.pos{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.gap{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row:first-child .gap{color:var(--tape);font-weight:500}

.strip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.elev{position:relative;height:96px}
.elev canvas{position:absolute;inset:0;width:100%;height:100%}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.tape{background:var(--tape);color:#fff}
.scrub{flex:1 1 220px;min-width:0;accent-color:var(--tape)}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.inl{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.laps{display:flex;flex-wrap:wrap;gap:4px}
.laps button{font-family:var(--mono);font-size:11px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.laps button:hover{color:var(--ink);border-color:var(--ink)}
.chapters{display:flex;flex-direction:column;gap:2px}
.chapters h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:500}
.chap{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-radius:6px;padding:5px 6px;color:var(--ink)}
.chap:hover,.chap[aria-current="true"]{background:var(--bg)}
.chap .when{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;min-width:0}
.card p{max-width:68ch;margin:6px 0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
input[type=file]{font:inherit;color:var(--muted);max-width:100%}
textarea{font-family:var(--mono);font-size:12px;resize:vertical}
.fields{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.inline label{flex:1 1 120px}
.bigclock{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.taps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.tap{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);text-align:left}
.tap:active,.tap.flash{background:var(--tape-soft);border-color:var(--tape)}
.tap .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tap .m{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.5em}
ol.steps{margin:6px 0;padding-left:20px;color:var(--muted);max-width:68ch}
ol.steps li{margin:3px 0}
code{font-family:var(--mono);font-size:12px}

/* duel */
.duel{position:relative;height:260px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
.duel canvas{position:absolute;inset:0;width:100%;height:100%}
.verdict{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,34px);line-height:1.1;margin:10px 0 2px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}

/* clip mode (9:16) */
.clipui{display:none}
body.clip{padding-block:10px}
body.clip header,body.clip #raceSel,body.clip #note,body.clip .board,body.clip .strip,body.clip .hud,body.clip .hud-r,body.clip .hint{display:none!important}
body.clip .desk{display:block}
body.clip .stage{aspect-ratio:9/16;width:min(100%,calc((100vh - 90px) * 9 / 16));min-height:0;margin:0 auto;border-radius:12px}
body.clip .clipui{display:flex;position:absolute;inset:0;flex-direction:column;justify-content:space-between;pointer-events:none;padding:5% 5% 4%}
body.clip .caption{left:5%;right:5%;bottom:auto;top:29%;max-width:none;font-size:clamp(18px,3.4vh,30px);text-align:left}
.ctop{display:flex;flex-direction:column;gap:2px;background:var(--scrim);border-radius:10px;padding:10px 12px;align-self:stretch}
.ctitle{font-family:var(--mono);font-size:clamp(10px,1.4vh,13px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cbrand{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vh,44px);line-height:1;letter-spacing:.01em}
.cbrand span{color:var(--tape)}
.cclock{font-family:var(--display);font-weight:700;font-size:clamp(40px,8vh,80px);line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.clap{font-family:var(--mono);font-size:clamp(11px,1.6vh,15px);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cbottom{display:flex;flex-direction:column;gap:8px;background:var(--scrim);border-radius:10px;padding:8px 10px}
.clist{display:flex;flex-direction:column;gap:3px}
.crow{display:grid;grid-template-columns:1.4em 0.7em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:clamp(14px,2.3vh,22px);font-weight:600}
.crow .dot{width:.7em;height:.7em}
.crow .g{font-family:var(--mono);font-weight:500;font-size:.8em;color:var(--muted)}
.cfoot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mono);font-size:clamp(9px,1.3vh,12px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cfoot .bello{font-size:clamp(12px,1.8vh,16px);letter-spacing:.22em;white-space:nowrap}
.cfoot>span:last-child{white-space:nowrap}
.cliptools{display:none}
body.clip .cliptools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script data-goatcounter="https://studiobello.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1>Koppenberg <span>Replay</span></h1>
      <div class="presented"><span data-i18n="presented"></span><span class="bello">STUDIO BELLO</span></div>
    </div>
    <div class="topbar">
      <nav aria-label="Views">
        <a href="#replay" id="tab-replay" data-i18n="tabReplay"></a>
        <a href="#duel" id="tab-duel" data-i18n="tabDuel"></a>
        <a href="#logger" id="tab-logger" data-i18n="tabLogger"></a>
        <a href="#data" id="tab-data" data-i18n="tabData"></a>
      </nav>
      <div class="lang" role="group" aria-label="Language"><button type="button" id="lang-nl">NL</button><button type="button" id="lang-en">EN</button></div>
    </div>
  </header>

  <!-- REPLAY -->
  <section id="view-replay">
    <div class="races" id="raceSel" style="margin-bottom:10px"></div>
    <div class="notice" id="note" style="margin-bottom:14px">
      <span class="tag" id="noteTag"></span><span id="noteText"></span><span class="src" id="noteSrc"></span>
    </div>
    <div class="desk">
      <div class="stage" id="stage">
        <canvas id="course" aria-label="Course with riders"></canvas>
        <div class="hud"><div class="clock" id="clock">0:00</div><div class="lap" id="lapLabel"></div></div>
        <div class="hud-r"><button class="chip" id="followChip" type="button" hidden></button></div>
        <div class="caption" id="caption" hidden></div>
        <div class="hint" data-i18n="hint"></div>
        <div class="clipui" aria-hidden="true">
          <div class="ctop">
            <div class="ctitle" id="cTitle"></div>
            <div class="cbrand">Koppenberg <span>Replay</span></div>
            <div class="cclock" id="cClock">0:00</div>
            <div class="clap" id="cLap"></div>
          </div>
          <div class="cbottom">
            <div class="clist" id="cList"></div>
            <div class="cfoot"><span id="cStatus"></span><span><span data-i18n="presented"></span> <span class="bello">STUDIO BELLO</span></span></div>
          </div>
        </div>
      </div>
      <aside class="board">
        <h2><span data-i18n="order"></span> <small data-i18n="gapToLeader"></small></h2>
        <div class="rows" id="rows" role="list"></div>
      </aside>
    </div>
    <div class="cliptools">
      <button class="btn tape" id="cPlay" type="button" data-i18n="play"></button>
      <button class="btn ghost" id="cRestart" type="button" data-i18n="fromStart"></button>
      <button class="btn ghost" id="cExit" type="button" data-i18n="exitClip"></button>
    </div>
    <div class="strip" style="margin-top:14px">
      <div class="elev"><canvas id="elev" aria-label="Elevation profile"></canvas></div>
      <div class="transport">
        <button class="btn tape" id="play" type="button" data-i18n="play"></button>
        <input class="scrub" id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Race time">
        <label class="inl"><span data-i18n="camera"></span><select id="camSel"></select></label>
        <label class="inl"><span data-i18n="speed"></span>
          <select id="speed"><option value="15">15×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="120">120×</option></select>
        </label>
        <button class="btn ghost" id="clipBtn" type="button" data-i18n="clipMode"></button>
      </div>
      <div class="laps" id="lapJumps"></div>
      <div class="chapters"><h3 data-i18n="chapters"></h3><div id="chapList"></div></div>
    </div>
  </section>

  <!-- DUEL -->
  <section id="view-duel" hidden>
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="duelTitle"></h2>
        <p data-i18n="duelIntro"></p>
        <div class="fields">
          <label for="gpx"><span data-i18n="gpxLabel"></span><input type="file" id="gpx" accept=".gpx,application/gpx+xml"></label>
          <div class="inline">
            <label for="manualT"><span data-i18n="manualLabel"></span><input type="text" id="manualT" placeholder="3:45"></label>
            <button class="btn ghost" id="manualGo" type="button" data-i18n="useTime"></button>
          </div>
          <label for="proSel"><span data-i18n="against"></span><select id="proSel"></select></label>
          <div class="status" id="duelStatus"></div>
        </div>
        <p style="font-size:12px" data-i18n="privacy"></p>
      </div>
      <div class="card">
        <h2 data-i18n="duelResult"></h2>
        <div class="verdict" id="verdict"></div>
        <div class="stats" id="duelStats"></div>
        <div class="duel"><canvas id="duelCv" aria-label="Duel on the Koppenberg"></canvas></div>
        <div class="inline" style="margin-top:8px"><button class="btn tape" id="duelPlay" type="button" data-i18n="playDuel"></button></div>
        <p style="font-size:12px" data-i18n="duelNote"></p>
      </div>
    </div>
  </section>

  <!-- LOGGER -->
  <section id="view-logger" hidden>
    <div class="card" style="margin-bottom:14px"><p data-i18n="logIntro"></p></div>
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="logSetup"></h2>
        <div class="fields">
          <div class="inline">
            <label for="lgTitle"><span data-i18n="raceName"></span><input type="text" id="lgTitle"></label>
            <label for="lgLaps" style="flex:0 1 110px"><span data-i18n="laps"></span><input type="number" id="lgLaps" min="1" max="15"></label>
          </div>
          <label for="lgRiders"><span data-i18n="ridersLabel"></span><textarea id="lgRiders" rows="9"></textarea></label>
          <div class="inline"><button class="btn ghost" id="lgApply" type="button" data-i18n="updateButtons"></button></div>
        </div>
      </div>
      <div class="card">

const LOOP_PX=[[1278,400],[1298,440],[1305,520],[1322,610],[1338,645],[1330,560],[1326,490],[1352,488],[1358,560],[1385,590],[1410,690],[1378,688],[1396,718],[1414,742],[1394,752],[1372,722],[1365,762],[1330,800],[1282,862],[1250,848],[1290,772],[1312,738],[1350,680],[1262,610],[1176,546],[1188,590],[1170,630],[1152,596],[1136,630],[1120,596],[1104,630],[1094,600],[1110,525],[1072,398],[1090,394],[1118,470],[1122,402],[1148,378],[1172,394],[1150,416],[1128,430],[1152,448],[1176,442],[1120,522],[1060,575],[975,665],[922,712],[860,650],[866,632],[914,690],[946,655],[900,605],[878,588],[868,555],[866,520],[890,504],[932,510],[940,528],[906,552],[876,548],[838,560],[790,562],[736,566],[720,522],[776,536],[800,496],[850,465],[975,416],[1005,372],[1020,326],[1004,318],[984,332],[956,326],[1000,290],[1140,345]];
const JOIN_IDX=74,LANE_PX=[[655,133],[770,186],[885,238],[1000,290]],LAP_M=3000;
// Steengat = the cobbled Koppenberg road: foot at the start flag (Melden side), top at the finish.
// Profile from public figures: ~64 m rise, ~120 m asphalt then cobbles, steepest (~20%+) on the upper middle, easing at the top.
const TOP=[1290,405],FOOT=[655,133],ROAD_LEN_PX=Math.hypot(TOP[0]-FOOT[0],TOP[1]-FOOT[1]),UX=(TOP[0]-FOOT[0])/ROAD_LEN_PX,UY=(TOP[1]-FOOT[1])/ROAD_LEN_PX;
const Z_FOOT=13,Z_TOP=77;
const roadF=s=>{s=Math.min(Math.max(s,0),1);const seg=[[0,0],[0.549,0.572],[0.62,0.643],[0.82,0.943],[1,1]];for(let i=1;i<seg.length;i++)if(s<=seg[i][0]){const [a,fa]=seg[i-1],[b,fb]=seg[i];return fa+(fb-fa)*(s-a)/(b-a)}return 1};
const roadPos=(x,y)=>{const ax=x-FOOT[0],ay=y-FOOT[1];return {s:(ax*UX+ay*UY)/ROAD_LEN_PX,off:Math.abs(ax*UY-ay*UX)}};
function elevAt(x,y){const r=roadPos(x,y);if(r.off<14&&r.s>-0.02&&r.s<1.03)return Z_FOOT+(Z_TOP-Z_FOOT)*roadF(r.s);return Math.max(12,78-0.0915*Math.hypot(x-TOP[0],y-TOP[1]))}
const onCobbles=(x,y)=>{const r=roadPos(x,y);return r.off<14&&r.s>0.19&&r.s<0.985};

function smoothClosed(pts,seg){const n=pts.length,out=[];for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t,f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1]),i])}}
  out.push([...out[0].slice(0,2),n-1]);return out}
const pxLen=a=>{let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);return L};
const loopDense=smoothClosed(LOOP_PX,10);
{let c=0;const tot=pxLen(loopDense);loopDense.forEach((p,i)=>{if(i)c+=Math.hypot(p[0]-loopDense[i-1][0],p[1]-loopDense[i-1][1]);p[3]=c/tot})}
const M_PER_PX=LAP_M/pxLen(loopDense);
function makeTrack(dense,N,laneFlags){
  const L=[0];for(let i=1;i<dense.length;i++)L.push(L[i-1]+Math.hypot(dense[i][0]-dense[i-1][0],dense[i][1]-dense[i-1][1]));
  const tot=L[L.length-1],P=[];let j=0;
  for(let k=0;k<=N;k++){const d=k/N*tot;while(j<L.length-2&&L[j+1]<d)j++;const a=dense[j],b=dense[j+1],u=(d-L[j])/((L[j+1]-L[j])||1);
    const px=a[0]+(b[0]-a[0])*u,py=a[1]+(b[1]-a[1])*u;const lf=(a[3]==null||b[3]==null)?null:(Math.abs(b[3]-a[3])>0.5?a[3]:a[3]+(b[3]-a[3])*u);
    P.push({x:px*M_PER_PX,y:py*M_PER_PX,z:elevAt(px,py),cob:onCobbles(px,py),lane:laneFlags?laneFlags(d/tot):false,loopD:lf})}
  const ds=tot*M_PER_PX/N,pace=[];
  for(let k=0;k<N;k++){const g=(P[k+1].z-P[k].z)/ds;const a0=P[Math.max(0,k-3)],a1=P[k],a2=P[Math.min(N,k+3)];
    const h1=Math.atan2(a1.y-a0.y,a1.x-a0.x),h2=Math.atan2(a2.y-a1.y,a2.x-a1.x);let dh=Math.abs(h2-h1);if(dh>Math.PI)dh=2*Math.PI-dh;
    pace.push(Math.max(0.7,1+9*Math.max(0,g)-2.5*Math.max(0,-g))+Math.min(1.1,dh/(ds*6+1e-6)*5)+(P[k].cob?0.3:0));P[k].grad=g}
  P[N].grad=P[N-1].grad;const TF=[0];for(let k=0;k<N;k++)TF.push(TF[k]+pace[k]);const Tt=TF[N];
  return {P,N,TF:TF.map(v=>v/Tt),paceTotal:Tt*ds}}
const LOOP=makeTrack(loopDense,900);
const joinDenseIdx=loopDense.findIndex(p=>p[2]===JOIN_IDX);
const lap1Dense=LANE_PX.map(p=>[p[0],p[1],-1,null]).concat(loopDense.slice(joinDenseIdx),loopDense.slice(1));
const laneLenPx=pxLen(LANE_PX),lap1LenPx=pxLen(lap1Dense);
const LAP1=makeTrack(lap1Dense,1100,f=>f*lap1LenPx<laneLenPx);
const LAP1_FACTOR=LAP1.paceTotal/LOOP.paceTotal;
// share of lap-1 time spent on the full start climb (start flag to the first finish-line crossing)
const CLIMB_SHARE=(()=>{for(let k=1;k<=LAP1.N;k++){const a=LAP1.P[k-1].loopD,b=LAP1.P[k].loopD;if(a!=null&&b!=null&&b<a-0.5)return LAP1.TF[k]}return 0.12})();

const timeFrac=(tr,d)=>{const x=Math.min(Math.max(d,0),1)*tr.N,i=Math.min(tr.N-1,Math.floor(x));return tr.TF[i]+(tr.TF[i+1]-tr.TF[i])*(x-i)};
const distFrac=(tr,f)=>{f=Math.min(Math.max(f,0),1);let lo=0,hi=tr.N;while(hi-lo>1){const m=(lo+hi)>>1;if(tr.TF[m]<=f)lo=m;else hi=m}return (lo+(f-tr.TF[lo])/((tr.TF[hi]-tr.TF[lo])||1))/tr.N};
const trackFor=lap=>lap===0?LAP1:LOOP;
function pointOn(tr,d){d=Math.min(Math.max(d,0),1);const x=d*tr.N,i=Math.min(tr.N-1,Math.floor(x)),u=x-i,a=tr.P[i],b=tr.P[i+1];
  return {x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,z:a.z+(b.z-a.z)*u,tx:b.x-a.x,ty:b.y-a.y,loopD:tr===LOOP?d:(a.loopD==null?null:a.loopD+(Math.abs(b.loopD-a.loopD)>0.5?0:(b.loopD-a.loopD)*u))}}

/* ================= YOU VS THE PRO ================= */
const duel={you:null,climb:null,playing:false,start:0,proIdx:0};
function proOptions(){const out=[];races.forEach((R,ri)=>R.riders.slice(0,3).forEach((r,k)=>{if(!r.lapT.length)return;out.push({label:r.name+" · "+R.title,name:r.name,time:r.lapT[0]*CLIMB_SHARE})}));return out}
function fillProSel(){const s=$("proSel"),cur=s.value;s.innerHTML="";proOptions().forEach((o,i)=>{const op=document.createElement("option");op.value=i;op.textContent=o.label+" · ~"+fmt(o.time);s.appendChild(op)});if(cur&&s.options[cur])s.value=cur;renderDuel()}
$("proSel").onchange=()=>{duel.playing=false;renderDuel()};
function haversine(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function findClimb(pts){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+haversine(pts[i-1],pts[i]));
  const e=pts.map((p,i)=>{let s=0,c=0;for(let j=Math.max(0,i-3);j<=Math.min(pts.length-1,i+3);j++){if(isFinite(pts[j].ele)){s+=pts[j].ele;c++}}return c?s/c:NaN});
  let best=null,j0=0;
  for(let i=0;i<pts.length;i++){while(j0<pts.length&&d[j0]-d[i]<450)j0++;for(let j=j0;j<pts.length&&d[j]-d[i]<=800;j++){const gain=e[j]-e[i],len=d[j]-d[i];
    if(gain>=45&&gain<=80&&gain/len>=0.07){const grade=gain/len,score=gain-0.01*len;if(!best||score>best.score)best={i,j,gain,len,grade,score}}}}
  if(!best)return null;const ti=pts[best.i].time,tj=pts[best.j].time;if(!isFinite(ti)||!isFinite(tj))return {...best,time:NaN};
  return {...best,time:(tj-ti)/1000}}
$("gpx").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const xml=new DOMParser().parseFromString(rd.result,"application/xml");const tp=[...xml.getElementsByTagName("trkpt")];if(!tp.length)throw 0;
      const pts=tp.map(n=>({lat:+n.getAttribute("lat"),lon:+n.getAttribute("lon"),ele:parseFloat((n.getElementsByTagName("ele")[0]||{}).textContent),time:Date.parse((n.getElementsByTagName("time")[0]||{}).textContent)}));
      const c=findClimb(pts);if(!c){$("duelStatus").textContent=T("noClimb");return}if(!isFinite(c.time)){$("duelStatus").textContent=T("noTime");return}
      track("duel-gpx");duel.you=c.time;duel.climb=c;$("duelStatus").textContent=T("foundClimb",{d:Math.round(c.len),h:Math.round(c.gain),p:(c.grade*100).toFixed(1),t:fmt(c.time)});duel.playing=false;renderDuel()}
    catch(err){$("duelStatus").textContent=T("badGpx")}};rd.readAsText(f)};
$("manualGo").onclick=()=>{const v=parseT($("manualT").value);if(!isFinite(v)||v<30){$("duelStatus").textContent=T("badTime");return}track("duel-tijd");duel.you=v;duel.climb=null;$("duelStatus").textContent="";duel.playing=false;renderDuel()};
$("duelPlay").onclick=()=>{if(duel.you==null){$("duelStatus").textContent=T("badTime");return}duel.playing=true;duel.start=performance.now()};
const ROAD_PROFILE=(()=>{const n=200,z=[],pace=[0];for(let k=0;k<=n;k++)z.push(Z_FOOT+(Z_TOP-Z_FOOT)*roadF(k/n));const len=ROAD_LEN_PX*M_PER_PX,ds=len/n;
  for(let k=0;k<n;k++){const g=(z[k+1]-z[k])/ds;pace.push(pace[k]+1+9*Math.max(0,g)+(k/n>0.19?0.3:0))}return {n,z,tf:pace.map(v=>v/pace[n])}})();

const dcv=$("duelCv"),dctx=dcv.getContext("2d");
function drawDuel(now){const r=dcv.getBoundingClientRect(),w=r.width,h=r.height;if(!w)return;const dpr=Math.min(2,window.devicePixelRatio||1);if(dcv.width!==Math.round(w*dpr)){dcv.width=w*dpr;dcv.height=h*dpr}
  dctx.setTransform(dpr,0,0,dpr,0,0);dctx.clearRect(0,0,w,h);const pad=24,X=f=>pad+f*(w-2*pad),Y=z=>h-pad-(z-Z_FOOT+4)/(Z_TOP-Z_FOOT+12)*(h-2*pad-20);

  dctx.font="500 11px "+css("--mono");dctx.fillStyle=css("--muted");dctx.textAlign="left";dctx.fillText(lang==="nl"?"VOET · MELDEN":"FOOT · MELDEN",X(0),h-6);dctx.textAlign="right";dctx.fillText(lang==="nl"?"TOP · STEENGAT":"TOP · STEENGAT",X(1),Y(Z_TOP)-14);
  const o=proOptions()[Number($("proSel").value)||0];if(!o||duel.you==null)return;
  const span=Math.max(duel.you,o.time),dur=6000;let el=now&&duel.playing?Math.min(1,(now-duel.start)/dur)*span:span;if(now&&duel.playing&&el>=span)duel.playing=false;

    dctx.font="600 13px "+css("--body");dctx.textAlign="center";dctx.fillStyle=css("--ink");dctx.fillText(label,x,y-24+dy)};
  draw(o.time,COLORS[0],last(o.name),0);draw(duel.you,COLORS[1],T("you"),-18);
  dctx.font="700 28px "+css("--display");dctx.textAlign="left";dctx.fillStyle=css("--ink");dctx.fillText(fmt(el),pad,pad+18)}
